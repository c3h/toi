name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Validar o pacote de publicação
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Guardar o build validado
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 3
      - name: Guardar diagnóstico dos testes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://toi.gimigliano.blog
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist/
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Conferir a publicação
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const response = await fetch('https://toi.gimigliano.blog/');
          if (response.status === 403 && response.headers.get('cf-mitigated') === 'challenge') {
            console.log('::warning::Publicação concluída; o Cloudflare desafiou o runner. Conferência HTTP pendente: abra https://toi.gimigliano.blog em um navegador.');
            process.exit(0);
          }
          assert.equal(response.status, 200);
          assert.equal(await response.text(), readFileSync('dist/index.html', 'utf8'));
          const csp = readFileSync('public/_headers', 'utf8').split('\n')
            .find(line => line.trimStart().startsWith('Content-Security-Policy:'))
            .trim().slice('Content-Security-Policy: '.length);
          assert.equal(response.headers.get('content-security-policy'), csp);
          assert.ok(response.headers.get('cache-control').includes('no-transform'));
          assert.equal(response.headers.get('nel'), null);
          assert.equal(response.headers.get('report-to'), null);
          console.log('HTTPS, HTML, CSP e ausência de relatórios conferidos.');
          JS
